<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dev Bank"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Deviation Bank</title>
<style>
/* Layout: sticky purple header with the three numbers that matter, then bid periods (left) and the selected period's entries (right) on iPad; stacked on phone */
:root {
  --bg: #f3f0f8; --panel: #ffffff; --ink: #1d1530; --muted: #6a6080; --line: #ddd6ea;
  --accent: #4d148c; --accent-ink: #ffffff; --good: #2f7d4f; --bad: #b3261e; --warn: #8a6d1f; --warn-bg: #f6edd4; --hover: #f7f4fb;
  --bar: #4d148c; --bar-ink: #ffffff; --bar-muted: #d6c6ef; --bar-tile: rgba(255,255,255,.12);
  --body: -apple-system, "SF Pro Text", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #110b1a; --panel: #1a1326; --ink: #e6dff1; --muted: #9d92b2; --line: #2d2440;
    --accent: #a57ce0; --accent-ink: #110b1a; --good: #5cc58a; --bad: #f2867e; --warn: #d8b65a; --warn-bg: #2b2412; --hover: #221a31;
    --bar: #2a1847; --bar-ink: #f1eafb; --bar-muted: #b9a6d8; --bar-tile: rgba(255,255,255,.07);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #110b1a; --panel: #1a1326; --ink: #e6dff1; --muted: #9d92b2; --line: #2d2440;
  --accent: #a57ce0; --accent-ink: #110b1a; --good: #5cc58a; --bad: #f2867e; --warn: #d8b65a; --warn-bg: #2b2412; --hover: #221a31;
  --bar: #2a1847; --bar-ink: #f1eafb; --bar-muted: #b9a6d8; --bar-tile: rgba(255,255,255,.07);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 var(--body); }
button, input, select, textarea { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
header { position: sticky; top: 0; z-index: 5; background: var(--bar); color: var(--bar-ink);
  padding: calc(env(safe-area-inset-top) + 10px) max(16px, env(safe-area-inset-right)) 12px max(16px, env(safe-area-inset-left)); }
.top { display: flex; align-items: center; gap: 12px; }
.top h1 { font-size: 18px; margin: 0; flex: 1; letter-spacing: .01em; }
.top button { background: var(--bar-tile); border: 1px solid rgba(255,255,255,.25); color: var(--bar-ink); border-radius: 10px; padding: 7px 12px; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
.tile { background: var(--bar-tile); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.tile .k { font-size: 12px; color: var(--bar-muted); text-transform: uppercase; letter-spacing: .05em; }
.tile .v { font-size: 26px; font-weight: 650; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .s { font-size: 12.5px; color: var(--bar-muted); margin-top: 2px; }
.tile .v.neg { color: #ffb4ae; }
main { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 16px; padding: 16px max(16px, env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); max-width: 1300px; margin: 0 auto; }
@media (max-width: 820px) { main { grid-template-columns: 1fr; } .tile .v { font-size: 21px; } }
@media (max-width: 600px) { header { position: static; } .tiles { gap: 6px; } .tile { padding: 8px 9px; } .tile .k { font-size: 10.5px; } .tile .v { font-size: 17px; } .tile .s { display: none; } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0; padding: 12px 14px 8px; display: flex; align-items: center; gap: 8px; }
.panel h2 .sp { flex: 1; }
.alerts { grid-column: 1 / -1; display: grid; gap: 8px; }
.alerts:empty { display: none; }
.alert { background: var(--warn-bg); color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); border-radius: 12px; padding: 10px 14px; font-size: 14.5px; }
.alert b { color: var(--ink); }
.bp { display: block; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 11px 14px; cursor: pointer; }
.bp:hover { background: var(--hover); }
.bp.sel { background: var(--hover); box-shadow: inset 4px 0 0 var(--accent); }
.bp .r1 { display: flex; gap: 8px; align-items: baseline; }
.bp .nm { font-weight: 600; flex: 1; }
.bp .dt { font-size: 13px; color: var(--muted); }
.bp .r2 { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13.5px; color: var(--muted); margin-top: 3px; }
.bp .r2 b { color: var(--ink); font-weight: 600; }
.tag { font-size: 11.5px; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.tag.now { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.pos { color: var(--good) !important; } .neg { color: var(--bad) !important; }
.sum { padding: 4px 14px 12px; display: grid; grid-template-columns: 1fr auto; gap: 4px 0; font-size: 14.5px; }
.sum .t { padding-left: 12px; }
.sum .l { color: var(--muted); } .sum .t { text-align: right; }
.sum .tot { font-weight: 650; border-top: 1px solid var(--line); padding-top: 6px; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 14px 12px; }
.btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 9px 14px; font-weight: 600; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
.btn.danger { background: transparent; color: var(--bad); border: 1px solid var(--line); }
.btn.sm { padding: 5px 10px; font-size: 14px; font-weight: 500; }
.ent { display: flex; gap: 10px; align-items: center; border-top: 1px solid var(--line); padding: 10px 14px; cursor: pointer; }
.ent:hover { background: var(--hover); }
.ent .ic { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-weight: 700; font-size: 14px; flex: none; }
.ic.c { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
.ic.e { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
.ic.h { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
.ent .md { flex: 1; min-width: 0; }
.ent .md .a { font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ent .md .b { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ent .amt { font-weight: 600; }
.empty { padding: 14px; color: var(--muted); border-top: 1px solid var(--line); font-size: 14.5px; }
label.chk { display: flex; gap: 8px; align-items: center; padding: 0 14px 12px; font-size: 14.5px; }
label.chk input { width: 20px; height: 20px; accent-color: var(--accent); }
dialog { border: 1px solid var(--line); border-radius: 16px; padding: 0; background: var(--panel); color: var(--ink); width: min(520px, calc(100vw - 32px)); max-height: calc(100vh - 40px); }
dialog::backdrop { background: rgba(10,5,20,.45); }
dialog form { padding: 16px; display: grid; gap: 12px; }
dialog h3 { margin: 0; font-size: 18px; }
.f { display: grid; gap: 4px; } .f > span { font-size: 13px; color: var(--muted); }
.f input, .f select, .f textarea { width: 100%; padding: 10px 11px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); min-height: 44px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.hint { font-size: 13px; color: var(--muted); margin: -4px 0 0; }
.dbtns { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.dbtns .grow { flex: 1; }
.rules { padding: 0 14px 14px 34px; margin: 0; font-size: 14.5px; }
.rules li { margin: 6px 0; } .rules .cite { color: var(--muted); font-size: 12.5px; }
.settings-list .bp { cursor: pointer; }
.qs { padding: 0 14px 14px; display: grid; gap: 12px; }
</style>
</head>
<body>
<header>
  <div class="top"><h1>Deviation Bank</h1><button id="setBtn" type="button">Setup &amp; backup</button></div>
  <div class="tiles">
    <div class="tile"><div class="k">Available now</div><div class="v num" id="tAvail">–</div><div class="s" id="tAvailS"></div></div>
    <div class="tile"><div class="k" id="tHacK">HAC bank</div><div class="v num" id="tHac">–</div><div class="s" id="tHacS"></div></div>
    <div class="tile"><div class="k" id="tExpK">Expires end of BP</div><div class="v num" id="tExp">–</div><div class="s" id="tExpS"></div></div>
  </div>
</header>
<main>
  <div class="alerts" id="alerts"></div>
  <section class="panel" aria-labelledby="bph"><h2 id="bph"><span class="sp">Bid periods</span><button class="btn sm ghost" type="button" id="addBp">+ Bid period</button></h2><div id="bpList"></div></section>
  <section class="panel" id="detail"></section>
</main>

<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<dialog id="askDlg"><form method="dialog"><p id="askMsg" style="margin:0"></p><div class="dbtns"><button class="btn ghost" value="no" id="askNo">Cancel</button><button class="btn" value="yes" id="askYes">OK</button></div></form></dialog>

<script>
const KEY = 'devbank-v1';
const HAC_CAP = 15000, HAC_PER_BP = 7500, DBA_LIFE = 3, HRC_CAP_2015 = 10000;
const blank = () => ({ bps: [], entries: [], reports: {} });
let S = load(), sel = null;

function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.bps) return s; } catch (e) {} return blank(); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { note('Couldn\'t save on this device. Copy a backup from Setup now.'); } render(); }
// In-page yes/no and notice boxes; some hosts block the browser's built-in ones.
function ask(msg, yes = 'OK', no = 'Cancel') {
  const d = $('askDlg'); $('askMsg').textContent = msg; $('askYes').textContent = yes;
  $('askNo').hidden = !no; if (no) $('askNo').textContent = no;
  return new Promise(res => { d.onclose = () => res(d.returnValue === 'yes'); d.returnValue = ''; d.showModal(); });
}
const note = msg => ask(msg, 'OK', null);
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => (n < 0 ? '−$' : '$') + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const r2 = n => Math.round(n * 100) / 100;
const uid = () => Math.random().toString(36).slice(2, 10);
const today = () => new Date().toISOString().slice(0, 10);
const addDays = (d, n) => { const x = new Date(d + 'T12:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
const fmtD = d => d ? new Date(d + 'T12:00:00Z').toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' }) : '';
const sortedBps = () => [...S.bps].sort((a, b) => a.start.localeCompare(b.start));
const bpFor = (date, bps) => bps.findIndex(b => date >= b.start && date <= b.end);

const CREDIT_BASIS = { est: 'Established Fare', base: 'Baseline Fare', higher: 'Higher of Baseline / Established', c130: '130% of Established Fare (8.C.3.a.vi)', opening: 'Opening leftover (DBA from before this app)', other: 'Other' };
const EXP_TYPES = { air: 'Air ticket', hotel: 'Hotel', perdiem: 'Non-taxable per diem', surface: 'Surface / train', parking: 'Parking', seat: 'Seat fee', fee: 'Change / cancel fee', other: 'Other' };
const HAC_TYPES = { dom: 'Hotel canceled, domestic', intl: 'Hotel canceled, international', opening: 'Opening HAC/HRC balance (from VIPS)', adj: 'Adjustment (+ or −)' };
const CATS = { fb: 'Front / back-end', mid: 'Mid-trip' };

// Walks the bid periods oldest to newest. Two rule sets, picked by each BP's first day:
// - 2015 CBA (until the Dec 2026 BP, 2026 CBA Appendix A Phase 2): unspent money is halved at BP end and the half
//   rolls into next BP's bank; HRC bank capped at $10,000.
// - 2026 CBA 8.C.2: each BP's surplus becomes a DBA lot that lives 3 more BPs; an overspend draws older lots
//   oldest-first; expired lots go to HAC at 50% (cap $15,000, ≤ $7,500 usable per BP).
// Either way an overspend is covered by the hotel fund only if the pilot elects it on the expense report,
// then by next BP's surplus, then payroll.
const DEFAULT_NEW_RULES = '2026-11-30';
const newRulesStart = () => S.newRules || DEFAULT_NEW_RULES;
const isNew = date => date >= newRulesStart();
function compute() {
  const bps = sortedBps(), n = bps.length, t = today();
  const res = bps.map(b => ({ bp: b, nr: isNew(b.start), credit: 0, spend: 0, outside: 0, hacIn: 0, mid: 0, carried: 0, fromDBA: 0, fromNext: 0, fromHAC: 0, payroll: 0, shortfall: 0, halved: 0, expired: 0, toHac: 0, lotsAfter: [], hacAfter: 0, availNow: 0, expiring: 0, entries: [] }));
  const orphans = [];
  let hacPre = 0;
  for (const e of S.entries) {
    const i = bpFor(e.date, bps);
    if (i < 0) { if (e.kind === 'hac' && (!n || e.date < bps[0].start)) hacPre += e.amount; else orphans.push(e); continue; }
    const r = res[i]; r.entries.push(e);
    if (e.kind === 'credit') { r.credit += e.amount; if (e.cat === 'mid') r.mid += e.amount; }
    else if (e.kind === 'exp') { if (e.outside) r.outside += e.amount; else { r.spend += e.amount; if (e.cat === 'mid') r.mid -= e.amount; } }
    else if (e.kind === 'hac') r.hacIn += e.amount;
  }
  const cap = r => r.nr ? HAC_CAP : HRC_CAP_2015;
  let lots = [], hac = Math.min(n && res[0].nr ? HAC_CAP : HRC_CAP_2015, hacPre), pend = 0;
    // last BP's overspend: this BP's surplus (8.C.2.a.ii.(a)), then payroll (8.C.5.d)
  // the pilot's choice on the expense report: take this BP's shortfall from the hotel fund
  const fromHotel = (r, over) => {
    if (!(over > 0) || !(S.useHac && S.useHac[r.bp.id])) return over;
    const h = Math.min(over, hac, r.nr ? HAC_PER_BP : Infinity); hac = r2(hac - h); r.fromHAC = h; return r2(over - h);
  };
  const settle = (i, surplus) => {
    if (!(pend > 0)) return surplus;
    const p = res[i - 1];
    if (surplus > 0) { const u = Math.min(surplus, pend); surplus = r2(surplus - u); pend = r2(pend - u); p.fromNext = u; }
    p.payroll = pend; pend = 0;
    return surplus;
  };
  for (let i = 0; i < n; i++) {
    const r = res[i], ended = r.bp.end < t || i < n - 1;
    hac = Math.min(cap(r), Math.max(0, hac + r.hacIn));
    const prevPend = pend;
    if (!r.nr) {
      r.carried = r2(lots.reduce((a, l) => a + l.amt, 0)); lots = [];
      const bal = r2(r.credit + r.carried - r.spend);
      r.availNow = r2(bal - prevPend);
      if (bal >= 0) {
        const dba = r2(bal / 2); r.halved = r2(bal - dba);
        r.expiring = r.halved; // shown as "lost at BP end"
        const left = settle(i, dba);
        if (left > 0) lots.push({ from: i, amt: left });
      } else { settle(i, 0); r.shortfall = -bal; pend = fromHotel(r, -bal); r.availNow = r2(r.availNow + r.fromHAC); }
      r.lotsAfter = lots.map(l => ({ ...l })); r.hacAfter = hac;
      continue;
    }
    let net = settle(i, r2(r.credit - r.spend));
    if (net < 0) {
      let over = -net;
      for (const l of lots) { if (!over) break; const u = Math.min(l.amt, over); l.amt = r2(l.amt - u); over = r2(over - u); r.fromDBA = r2(r.fromDBA + u); }
      lots = lots.filter(l => l.amt > 0);
      r.shortfall = over; pend = fromHotel(r, over);
    } else if (net > 0) lots.push({ from: i, amt: net });
    r.lotsAfter = lots.map(l => ({ ...l }));
    r.hacAfter = hac;
    r.availNow = r2(lots.reduce((a, l) => a + l.amt, 0) - pend);
    // end of BP i: a lot from BP i-3 has had its 3 additional BPs; half goes to HAC (8.C.2.a.iii).
    // The last 2015-rules BP's carry-forward is treated as a lot from that BP.
    const exp = lots.filter(l => l.from <= i - DBA_LIFE);
    r.expiring = r2(exp.reduce((a, l) => a + l.amt, 0));
    if (ended) {
      r.expired = r.expiring; r.toHac = r2(r.expired / 2);
      const before = hac; hac = Math.min(HAC_CAP, r2(hac + r.toHac)); r.hacLost = r2(r.toHac - (hac - before));
      lots = lots.filter(l => l.from > i - DBA_LIFE);
    }
  }
  if (pend > 0 && n) res[n - 1].pendingShort = pend;
  let cur = bps.findIndex(b => t >= b.start && t <= b.end);
  if (cur < 0) { cur = -1; bps.forEach((b, i) => { if (b.start <= t) cur = i; }); }
  return { bps, res, cur, orphans, hacEnd: hac };
}

let C;
function render() {
  C = compute();
  const { bps, res, cur, orphans } = C;
  if (sel == null || !S.bps.find(b => b.id === sel)) sel = cur >= 0 ? bps[cur].id : (bps.length ? bps[bps.length - 1].id : null);
  const rc = cur >= 0 ? res[cur] : null;
  // header tiles
  if (rc) {
    $('tAvail').textContent = money(rc.availNow); $('tAvail').classList.toggle('neg', rc.availNow < 0);
    $('tAvailS').textContent = rc.bp.name + ' · this BP ' + money(r2(rc.credit - rc.spend)) + ' + carried';
    $('tHacK').textContent = rc.nr ? 'HAC bank' : 'HRC bank';
    $('tHac').textContent = money(rc.hacAfter);
    $('tHacS').textContent = rc.nr ? 'Up to ' + money(Math.min(HAC_PER_BP, rc.hacAfter)) + ' usable this BP' : 'Cap ' + money(HRC_CAP_2015) + ' (2015 rules)';
    $('tExpK').textContent = rc.nr ? 'Expires end of BP' : 'Lost end of BP';
    $('tExp').textContent = money(rc.expiring || 0);
    $('tExpS').textContent = rc.nr ? (rc.expiring ? 'On ' + fmtD(rc.bp.end) + ', half (' + money(rc.expiring / 2) + ') goes to HAC' : 'Nothing expires ' + fmtD(rc.bp.end))
      : (rc.expiring ? 'Half of what\'s unspent on ' + fmtD(rc.bp.end) : 'Nothing unspent to lose');
  } else {
    $('tAvail').textContent = '–'; $('tAvailS').textContent = 'Add the current bid period to start';
    $('tHac').textContent = '–'; $('tHacS').textContent = ''; $('tExp').textContent = '–'; $('tExpS').textContent = '';
  }
  // alerts
  const al = [];
  if (rc && rc.pendingShort) al.push('This BP is <b>' + money(rc.pendingShort) + '</b> over the bank and all carried DBA. Next BP\'s surplus covers it, or you can elect the hotel fund on the expense report; anything left is a payroll deduction (8.C.5.d).');
  if (cur > 0) { const p = bps[cur - 1]; if (!S.reports[p.id]) al.push('Expense report for <b>' + esc(p.name) + '</b> is due by ' + fmtD(bps[cur].end) + '. Late reports can hold up your carried balance (8.C.5).'); }
  res.forEach(r => { if (r.payroll > 0 && r.bp.end >= addDays(today(), -60)) al.push('<b>' + esc(r.bp.name) + '</b>: ' + money(r.payroll) + ' left over after DBA and HAC, expect a payroll deduction.'); });
  if (orphans.length) al.push(orphans.length + ' entr' + (orphans.length > 1 ? 'ies are' : 'y is') + ' dated outside every bid period, so ' + (orphans.length > 1 ? 'they don\'t' : 'it doesn\'t') + ' count. Add the bid period that covers ' + orphans.map(e => fmtD(e.date)).join(', ') + '.');
  $('alerts').innerHTML = al.map(a => '<div class="alert">' + a + '</div>').join('');
  // bid period list (newest first)
  $('bpList').innerHTML = bps.length ? res.map((r, i) => ({ r, i })).reverse().map(({ r, i }) => {
    const net = r2(r.credit - r.spend);
    return '<button type="button" class="bp' + (r.bp.id === sel ? ' sel' : '') + '" data-bp="' + r.bp.id + '"><div class="r1"><span class="nm">' + esc(r.bp.name) + '</span>' +
      (i === cur ? '<span class="tag now">Now</span>' : '') + (S.reports[r.bp.id] ? '<span class="tag">Report in</span>' : '') +
      '<span class="dt">' + fmtD(r.bp.start) + ' – ' + fmtD(r.bp.end) + '</span></div><div class="r2 num"><span>Credit <b>' + money(r.credit) + '</b></span><span>Spent <b>' + money(r.spend) +
      '</b></span><span>Net <b class="' + (net < 0 ? 'neg' : net > 0 ? 'pos' : '') + '">' + money(net) + '</b></span>' + (r.expired ? '<span>Expired <b>' + money(r.expired) + '</b></span>' : '') + '</div></button>';
  }).join('') : '<div class="empty">No bid periods yet.</div>';
  renderDetail();
}

function renderDetail() {
  const { bps, res } = C, i = bps.findIndex(b => b.id === sel), d = $('detail');
  if (i < 0) { renderQuickStart(d); return; }
  const r = res[i], net = r2(r.credit - r.spend);
  const line = (l, v, cls) => '<div class="l' + (cls ? ' ' + cls : '') + '">' + l + '</div><div class="t num' + (cls ? ' ' + cls : '') + '">' + v + '</div>';
  const hb = r.nr ? 'HAC' : 'HRC';
  let s = line('Deadhead credits', money(r.credit));
  if (!r.nr && r.carried) s += line('Carried in from last BP', money(r.carried));
  s += line('Deviation spending', '−' + money(r.spend));
  const bal = r.nr ? net : r2(net + r.carried);
  s += line(r.nr ? 'Net this BP' : 'Balance', '<span class="' + (bal < 0 ? 'neg' : 'pos') + '">' + money(bal) + '</span>', 'tot');
  if (r.fromDBA) s += line('Covered by older DBA', money(r.fromDBA));
  if (r.halved) s += line('Halved at BP end (2015 rules), lost', '<span class="neg">' + money(r.halved) + '</span>');
  if (r.fromNext) s += line('Covered by next BP surplus', money(r.fromNext));
  if (r.fromHAC) s += line('Taken from ' + hb + ' (your choice)', money(r.fromHAC));
  if (r.payroll) s += line('Payroll deduction', '<span class="neg">' + money(r.payroll) + '</span>');
  if (r.pendingShort) s += line('Not yet covered', '<span class="neg">' + money(r.pendingShort) + '</span>');
  if (r.outside) s += line('Paid outside the bank', money(r.outside));
  const lots = r.lotsAfter.filter(l => l.amt > 0);
  if (r.nr) {
    if (lots.length) s += lots.map(l => line('DBA from ' + esc(bps[l.from].name) + (l.from <= i - DBA_LIFE ? ' (last BP)' : ', ' + (DBA_LIFE - (i - l.from)) + ' BP left'), money(l.amt))).join('');
    s += line('Available after this BP', money(r.availNow), 'tot');
  } else s += line('Carried to next BP', money(lots.reduce((a, l) => a + l.amt, 0)), 'tot');
  if (r.expired) s += line('Expired at BP end → HAC at 50%', money(r.expired) + ' → ' + money(r.toHac));
  if (r.hacLost) s += line('Lost to the $15,000 HAC cap', '<span class="neg">' + money(r.hacLost) + '</span>');
  if (r.mid && r.entries.some(e => e.cat === 'mid')) s += line('Mid-trip category net (kept separate, 8.C.2.d)', money(r2(r.mid)));
  const ents = [...r.entries].sort((a, b) => a.date.localeCompare(b.date));
  const ic = { credit: ['c', '+'], exp: ['e', '−'], hac: ['h', 'H'] };
  const desc = e => e.kind === 'credit' ? [e.trip || 'Deadhead credit', CREDIT_BASIS[e.basis]] : e.kind === 'exp' ? [EXP_TYPES[e.type] + (e.trip ? ' · ' + e.trip : ''), e.outside ? 'Outside the bank' : (e.cat === 'mid' ? 'Mid-trip' : '')] : [HAC_TYPES[e.type], isNew(e.date) ? 'HAC bank' : 'HRC bank'];
  d.innerHTML = '<h2><span class="sp">' + esc(r.bp.name) + ' · ' + fmtD(r.bp.start) + ' – ' + fmtD(r.bp.end) + '</span></h2><div class="sum">' + s + '</div>' +
    (r.shortfall > 0 ? '<label class="chk"><input type="checkbox" id="hacChk"' + (S.useHac && S.useHac[r.bp.id] ? ' checked' : '') + '> Cover the ' + money(r.shortfall) + ' overspend from the ' + hb + ' bank (you elect this on the expense report)</label>' : '') +
    '<label class="chk"><input type="checkbox" id="repChk"' + (S.reports[r.bp.id] ? ' checked' : '') + '> Expense report submitted for this BP</label>' +
    '<div class="acts"><button class="btn" type="button" data-add="credit">+ Deadhead credit</button><button class="btn" type="button" data-add="exp">+ Expense</button><button class="btn ghost" type="button" data-add="hac">+ ' + (r.nr ? 'HAC' : 'HRC') + '</button></div>' +
    (ents.length ? ents.map(e => { const [a, b] = desc(e); return '<div class="ent" data-ent="' + e.id + '" role="button" tabindex="0"><div class="ic ' + ic[e.kind][0] + '">' + ic[e.kind][1] + '</div><div class="md"><div class="a">' + esc(a) + '</div><div class="b">' + fmtD(e.date) + (b ? ' · ' + esc(b) : '') + (e.note ? ' · ' + esc(e.note) : '') + '</div></div><div class="amt num ' + (e.kind === 'exp' ? 'neg' : e.kind === 'credit' ? 'pos' : '') + '">' + money(e.amount) + '</div></div>'; }).join('') : '<div class="empty">No entries in this bid period yet.</div>');
  if ($('hacChk')) $('hacChk').onchange = ev => { S.useHac = S.useHac || {}; if (ev.target.checked) S.useHac[r.bp.id] = true; else delete S.useHac[r.bp.id]; save(); };
  $('repChk').onchange = ev => { if (ev.target.checked) S.reports[r.bp.id] = true; else delete S.reports[r.bp.id]; save(); };
}

// First run: one form that creates the current bid period with what VIPS shows today.
function renderQuickStart(d) {
  d.innerHTML = '<h2>Get started</h2><form id="qs" class="qs">' +
    '<p class="hint" style="margin:0">Enter what VIPS shows today. You can add trips and expenses after.</p>' +
    field('Current bid period', '<input id="qsName" required placeholder="e.g. Oct 2026">') +
    '<div class="row2">' + field('First day', '<input id="qsStart" type="date" required>') + field('Last day', '<input id="qsEnd" type="date" required>') + '</div>' +
    '<div class="row2">' + field('Carried in from earlier periods ($)', '<input id="qsCarry" type="number" inputmode="decimal" step="0.01" min="0" placeholder="VIPS total from other periods">') +
    field('Hotel fund, HRC / HAC ($)', '<input id="qsHac" type="number" inputmode="decimal" step="0.01" min="0" placeholder="Total Available Hotel Funds">') + '</div>' +
    '<p class="hint" style="margin:0">VIPS: FOX Status Reports, Deviation Bank Allocation Balance, set to the current period. The hotel fund is at the bottom of any expense report.</p>' +
    '<div class="dbtns"><button class="btn">Start tracking</button></div></form>';
  $('qs').onsubmit = ev => {
    ev.preventDefault();
    const b = { id: uid(), name: $('qsName').value.trim(), start: $('qsStart').value, end: $('qsEnd').value };
    if (b.end < b.start) { note('Last day is before the first day.'); return; }
    S.bps.push(b); sel = b.id;
    const c = parseFloat($('qsCarry').value), h = parseFloat($('qsHac').value);
    if (c > 0) S.entries.push({ id: uid(), kind: 'credit', date: b.start, amount: r2(c), basis: 'opening', cat: 'fb', trip: 'Carried in (VIPS)', note: '' });
    if (h > 0) S.entries.push({ id: uid(), kind: 'hac', date: addDays(b.start, -1), amount: r2(h), type: 'opening', note: 'From expense report' });
    save();
  };
}

// ---------- dialogs ----------
const dlg = $('dlg'), form = $('dlgForm');
const field = (label, html) => '<label class="f"><span>' + label + '</span>' + html + '</label>';
const opts = (o, v) => Object.entries(o).map(([k, t]) => '<option value="' + k + '"' + (k === v ? ' selected' : '') + '>' + esc(t) + '</option>').join('');
function defaultDate() { const b = S.bps.find(x => x.id === sel); const t = today(); return b && !(t >= b.start && t <= b.end) ? b.start : t; }

function openEntry(kind, e) {
  e = e || { kind, date: defaultDate(), cat: 'fb', basis: 'est', type: kind === 'exp' ? 'air' : 'intl' };
  const amt = field('Amount ($)', '<input name="amount" type="number" inputmode="decimal" step="0.01" required value="' + (e.amount ?? '') + '">');
  const date = field('Date', '<input name="date" type="date" required value="' + e.date + '">');
  let body = '';
  if (kind === 'credit') body = '<h3>' + (e.id ? 'Edit' : 'Add') + ' deadhead credit</h3>' +
    '<div class="row2">' + field('Deadhead showtime', '<input name="date" type="date" required value="' + e.date + '">') + amt + '</div>' +
    '<p class="hint">Use the deadhead\'s showtime: a carryover trip\'s deadhead credits the BP it shows in (8.C.2.c). Fares are on the VIPS Trip Pairing screen.</p>' +
    field('Trip / route', '<input name="trip" placeholder="e.g. 1234 MEM-CDG" value="' + esc(e.trip) + '">') +
    '<div class="row2">' + field('Fare credited', '<select name="basis">' + opts(CREDIT_BASIS, e.basis) + '</select>') + field('Category', '<select name="cat">' + opts(CATS, e.cat) + '</select>') + '</div>' +
    '<p class="hint">Deviation filed before the BP starts: higher of Baseline or Established. On or after day 1: Established (8.C.2.b.i). Revised or late-built trips: higher of the two (8.C.2.b.ii).</p>';
  else if (kind === 'exp') body = '<h3>' + (e.id ? 'Edit' : 'Add') + ' deviation expense</h3>' +
    '<div class="row2">' + date + amt + '</div>' +
    '<div class="row2">' + field('Type', '<select name="type">' + opts(EXP_TYPES, e.type) + '</select>') + field('Category', '<select name="cat">' + opts(CATS, e.cat) + '</select>') + '</div>' +
    field('Trip / note', '<input name="trip" placeholder="e.g. DL 84 ATL-CDG, J" value="' + esc(e.trip) + '">') +
    '<label class="chk" style="padding:0"><input type="checkbox" name="outside"' + (e.outside ? ' checked' : '') + '> Reimbursed outside the bank (e.g. 8.C.1.f.ii revision, 8.C.3.a.v first class)</label>';
  else body = '<h3>' + (e.id ? 'Edit' : 'Add') + ' HAC / HRC entry</h3>' +
    '<div class="row2">' + date + amt + '</div>' + field('Type', '<select name="type" id="hacType">' + opts(HAC_TYPES, e.type) + '</select>') +
    '<p class="hint">For each hotel you cancel 26+ hours ahead, on a trip you fly: $35 / $65 under the 2015 rules, $50 / $70 from the Dec 2026 BP (8.C.2.h). Use a negative adjustment to match VIPS.</p>';
  body += field('Note', '<input name="note" value="' + esc(e.note) + '">');
  body += '<div class="dbtns">' + (e.id ? '<button class="btn danger" type="button" id="delBtn">Delete</button>' : '') + '<span class="grow"></span><button class="btn ghost" value="cancel" formnovalidate>Cancel</button><button class="btn" value="ok">Save</button></div>';
  form.innerHTML = body;
  const ht = $('hacType'); if (ht) { const fill = () => { const nr = isNew(form.date.value); if (ht.value === 'dom') form.amount.value = nr ? 50 : 35; else if (ht.value === 'intl') form.amount.value = nr ? 70 : 65; }; ht.onchange = fill; form.date.addEventListener('change', fill); if (!e.id) fill(); }
  if (e.id) $('delBtn').onclick = async () => { if (await ask('Delete this entry?', 'Delete')) { S.entries = S.entries.filter(x => x.id !== e.id); dlg.close(); save(); } };
  form.onsubmit = ev => {
    if (ev.submitter && ev.submitter.value === 'cancel') return;
    const f = form, a = parseFloat(f.amount.value);
    if (isNaN(a) || (kind !== 'hac' && a < 0)) { ev.preventDefault(); f.amount.focus(); return; }
    const x = { id: e.id || uid(), kind, date: f.date.value, amount: r2(a), note: f.note.value.trim() };
    if (f.trip) x.trip = f.trip.value.trim();
    if (f.cat) x.cat = f.cat.value;
    if (f.basis) x.basis = f.basis.value;
    if (f.type) x.type = f.type.value;
    if (f.outside) x.outside = f.outside.checked;
    S.entries = S.entries.filter(y => y.id !== x.id).concat(x);
    const i = bpFor(x.date, sortedBps()); if (i >= 0) sel = sortedBps()[i].id;
    save();
  };
  dlg.showModal();
}

function openBp(b) {
  const bps = sortedBps(), last = bps[bps.length - 1];
  b = b || { name: '', start: last ? addDays(last.end, 1) : today(), end: last ? addDays(last.end, 28) : addDays(today(), 27) };
  form.innerHTML = '<h3>' + (b.id ? 'Edit' : 'Add') + ' bid period</h3>' + field('Name', '<input name="name" required placeholder="e.g. Nov 2026" value="' + esc(b.name) + '">') +
    '<div class="row2">' + field('First day', '<input name="start" type="date" required value="' + b.start + '">') + field('Last day', '<input name="end" type="date" required value="' + b.end + '">') + '</div>' +
    '<div class="acts" style="padding:0"><button class="btn sm ghost" type="button" data-len="28">4 weeks</button><button class="btn sm ghost" type="button" data-len="35">5 weeks</button><button class="btn sm ghost" type="button" data-len="42">6 weeks</button></div>' +
    '<p class="hint">Bid periods are 28, 35 or 42 days and start on a Sunday or Monday (25.A.1). Take the dates from the bid package.</p>' +
    '<div class="dbtns">' + (b.id ? '<button class="btn danger" type="button" id="delBtn">Delete</button>' : '') + '<span class="grow"></span><button class="btn ghost" value="cancel" formnovalidate>Cancel</button><button class="btn" value="ok">Save</button></div>';
  form.querySelectorAll('[data-len]').forEach(x => x.onclick = () => { form.end.value = addDays(form.start.value, +x.dataset.len - 1); });
  if (b.id) $('delBtn').onclick = async () => { if (await ask('Delete this bid period? Its entries stay, but won\'t count until a bid period covers their dates.', 'Delete')) { S.bps = S.bps.filter(x => x.id !== b.id); delete S.reports[b.id]; dlg.close(); save(); } };
  form.onsubmit = ev => {
    if (ev.submitter && ev.submitter.value === 'cancel') return;
    const f = form, x = { id: b.id || uid(), name: f.name.value.trim(), start: f.start.value, end: f.end.value };
    const clash = S.bps.find(y => y.id !== x.id && x.start <= y.end && x.end >= y.start);
    if (x.end < x.start || clash) { ev.preventDefault(); note(clash ? 'Those dates overlap ' + clash.name + '.' : 'Last day is before the first day.'); return; }
    S.bps = S.bps.filter(y => y.id !== x.id).concat(x); sel = x.id; save();
  };
  dlg.showModal();
}

function openSettings() {
  const bps = sortedBps();
  form.innerHTML = '<h3>Setup &amp; backup</h3>' +
    '<p class="hint" style="margin:0">Your entries live only in this browser on this device. Copy a backup now and then and paste it into Notes or an email to yourself. Paste it back here to restore it, or to move to another device.</p>' +
    '<div class="acts" style="padding:0"><button class="btn" type="button" id="expBtn">Copy backup</button><button class="btn ghost" type="button" id="saveBtn">Save as file</button><button class="btn ghost" type="button" id="impBtn">Restore from file</button><input type="file" id="impFile" accept=".json,application/json" hidden></div>' +
    field('Backup text', '<textarea id="bkText" rows="3" placeholder="Paste a backup here to restore it"></textarea>') +
    '<div class="acts" style="padding:0"><button class="btn ghost" type="button" id="pasteBtn">Restore from pasted text</button><span class="hint" id="bkMsg" style="margin:0;align-self:center"></span></div>' +
    '<div class="panel settings-list"><h2>Bid periods (tap to edit)</h2>' + (bps.length ? bps.slice().reverse().map(b => '<button type="button" class="bp" data-ebp="' + b.id + '"><div class="r1"><span class="nm">' + esc(b.name) + '</span><span class="dt">' + fmtD(b.start) + ' – ' + fmtD(b.end) + '</span></div></button>').join('') : '<div class="empty">None yet.</div>') + '</div>' +
    field('First day of the December 2026 bid period (2026 bank rules start)', '<input id="nrDate" type="date" value="' + newRulesStart() + '">') +
    '<p class="hint" style="margin-top:-6px">Appendix A of the 2026 CBA phases the new bank rules in on this day. Bid periods starting earlier use the 2015 rules.</p>' +
    '<div class="panel"><h2>Until the December 2026 bid period (2015 CBA rules)</h2><ul class="rules">' +
    '<li>Whatever is unspent at the end of a bid period is cut in half. That half covers last BP\'s overspend first, and the rest rolls into next BP\'s bank. <span class="cite">2015 8.C.2.a.ii</span></li>' +
    '<li>Money that rolls forward and goes unspent again is halved again, so it shrinks every BP you don\'t use it.</li>' +
    '<li>HRC bank: $35 domestic / $65 international per hotel canceled 26+ hours out; capped at $10,000, with no per-BP limit. <span class="cite">2015 8.C.2.h</span></li>' +
    '</ul></div>' +
    '<div class="panel"><h2>From the December 2026 bid period (CBA 2026, Section 8.C)</h2><ul class="rules">' +
    '<li>Each bid period\'s bank is the fares of the scheduled commercial deadheads on trips flown that BP, plus recurrent training deadheads. <span class="cite">8.C.2.a.i</span></li>' +
    '<li>Notify the deviation before the BP starts and you get the higher of Baseline or Established Fare; on or after day 1, the Established Fare. <span class="cite">8.C.2.b</span></li>' +
    '<li>Booked in economy on a deadhead over 10 block hours and under 16 duty, deviating for a higher class: 130% of the Established Fare. <span class="cite">8.C.3.a.vi</span></li>' +
    '<li>Unspent money (DBA) stays for 3 more bid periods. It covers last BP\'s overspend first, then carries forward; the oldest money is used first. <span class="cite">8.C.2.a.ii</span></li>' +
    '<li>After those 3 BPs, what\'s left is cut in half and moved to the HAC bank. <span class="cite">8.C.2.a.iii</span></li>' +
    '<li>HAC: $50 domestic / $70 international per hotel canceled 26+ hours out on a trip you fly. Capped at $15,000; up to $7,500 can cover overspend in any one BP. <span class="cite">8.C.2.h</span></li>' +
    '<li>Overspend left after all that is payroll-deducted (25% limit), unless you elect to take it from the hotel fund on the expense report. <span class="cite">8.C.5.d</span></li>' +
    '<li>Front/back-end and mid-trip deadheads are separate categories; mid-trip deviations need Fleet Captain approval. <span class="cite">8.C.2.d, 8.C.1.g</span></li>' +
    '<li>File the expense report by the end of the next BP. From the Aug 2027 BP, carried DBA is only available once every earlier report is in. <span class="cite">8.C.5.c, Appendix A Phase 3</span></li>' +
    '<li>In the app, an overspend uses older DBA first, then the hotel fund if you tick it for that BP, then next BP\'s surplus, then payroll. VIPS has the final word.</li>' +
    '</ul></div>' +
    '<div class="dbtns"><button class="btn danger" type="button" id="wipeBtn">Erase all data</button><span class="grow"></span><button class="btn" value="cancel" formnovalidate>Done</button></div>';
  form.onsubmit = () => {};
  $('nrDate').onchange = ev => { if (ev.target.value) { S.newRules = ev.target.value; save(); } };
  form.querySelectorAll('[data-ebp]').forEach(x => x.onclick = () => openBp(S.bps.find(b => b.id === x.dataset.ebp)));
  const restore = async txt => {
    try { const d = JSON.parse(txt); if (!d.bps || !d.entries) throw 0; if (await ask('Replace everything here with this backup (' + d.bps.length + ' bid periods, ' + d.entries.length + ' entries)?', 'Replace')) { S = { reports: {}, ...d }; sel = null; dlg.close(); save(); } }
    catch (e) { note('That isn\'t a Deviation Bank backup.'); }
  };
  $('expBtn').onclick = async () => {
    const t = $('bkText'); t.value = JSON.stringify(S);
    try { await navigator.clipboard.writeText(t.value); $('bkMsg').textContent = 'Copied. Paste it somewhere safe.'; }
    catch (e) { t.focus(); t.select(); $('bkMsg').textContent = 'Selected. Use Copy to save it.'; }
  };
  $('pasteBtn').onclick = () => restore($('bkText').value);
  $('saveBtn').onclick = async () => {
    const name = 'deviation-bank-' + today() + '.json', blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' });
    try { const file = new File([blob], name, { type: 'application/json' }); if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; } } catch (e) { if (e.name === 'AbortError') return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  };
  $('impBtn').onclick = () => $('impFile').click();
  $('impFile').onchange = async ev => {
    const f = ev.target.files[0]; if (f) restore(await f.text());
  };
  $('wipeBtn').onclick = async () => { if (await ask('Erase every bid period and entry on this device? Copy a backup first if unsure.', 'Erase')) { S = blank(); sel = null; dlg.close(); save(); } };
  dlg.showModal();
}

document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-bp],[data-add],[data-ent]'); if (!t) return;
  if (t.dataset.bp) { sel = t.dataset.bp; render(); if (innerWidth <= 820) $('detail').scrollIntoView({ behavior: 'smooth' }); }
  else if (t.dataset.add) openEntry(t.dataset.add);
  else if (t.dataset.ent) { const e = S.entries.find(x => x.id === t.dataset.ent); if (e) openEntry(e.kind, { ...e }); }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Enter' && ev.target.dataset && ev.target.dataset.ent) ev.target.click(); });
$('addBp').onclick = () => openBp();
$('setBtn').onclick = openSettings;
window.addEventListener('storage', () => { S = load(); render(); });
render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
